name: Bug report
description: Report a reproducible Whyve problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please share the smallest reproducible case.
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Codex
        - Claude Code
        - Both
        - Other
    validations:
      required: true
  - type: input
    id: plugin_versions
    attributes:
      label: Plugin versions
      description: List the installed context-core and semantic-owner versions.
      placeholder: context-core 0.x, context-decision 0.x
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Node.js / Electron version
      placeholder: Node.js 24.x or Electron 44.x
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the commands or conversation steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Run the relevant read-only doctor command. Remove secrets, usernames, home-directory paths, repository paths, and other local identifiers before posting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and local paths from the report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
