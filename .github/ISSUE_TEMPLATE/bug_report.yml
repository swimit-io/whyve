name: Bug report
description: Report a reproducible Whyve problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please share the smallest reproducible case.
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Codex
        - Claude Code
        - Both
        - Other
    validations:
      required: true
  - type: input
    id: whyve_version
    attributes:
      label: Whyve version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Node.js / Electron version
      placeholder: Node.js 24.x or Electron 44.x
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the commands or conversation steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`whyve doctor` output"
      description: "Paste the output of `whyve doctor` (in the plugin, `node <plugin>/skills/context/scripts/context_cli.mjs doctor`). It is read-only. Remove secrets, usernames, home-directory paths, repository paths, and other local identifiers first."
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed secrets and local paths from the report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
